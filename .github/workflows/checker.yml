name: WTI Hourly Checker

on:
  schedule:
    # Esegue il test ogni ora dal lunedì al venerdì 
    # (Dalle 7:00 alle 16:00 UTC corrispondono alle 9:00 - 18:00 in Italia)
    - cron: '0 7-16 * * 1-5'
  workflow_dispatch: # Ti permette di testarlo manualmente quando vuoi da GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo script checker.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python checker.py
