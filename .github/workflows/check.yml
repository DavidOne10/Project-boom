name: WTI Automated Checker

on:
  schedule:
    # Orario in formato UTC (es. 08:00 e 12:30 UTC corrispondono rispettivamente alle 10:00 e 14:30 in Italia con ora legale)
    - cron: '0 8,30 12 * * 1-5'
  workflow_dispatch: # Ti permette di testarlo a mano con un click dalla tab "Actions" su GitHub

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checker script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python checker.py
