name: Europe Session (CAC 40)

on:
  schedule:
    # Finestra 09:15 - 17:30 CET (UTC: 07:15 - 15:30)
    - cron: '15,30,45 7 * * 1-5'
    - cron: '*/15 8-14 * * 1-5'
    - cron: '0,15,30 15 * * 1-5'
  workflow_dispatch:

jobs:
  check-cac40:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz yfinance

      - name: Esegui controllo CAC 40
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python cac40_checker.py
