name: Europe Session (CAC 40_DAX)

on:
  schedule:
    # Esecuzione EOD: lun-ven alle 15:45 UTC (17:45 CEST italiane)
    - cron: '45 15 * * 1-5'

  workflow_dispatch:

jobs:
  run-europe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz yfinance
      - name: Run Strategies
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python cac40_checker.py
          python dax_checker.py
